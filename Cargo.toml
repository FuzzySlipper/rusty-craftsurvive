[package]
name = "rusty-craftsurvive"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
rusty-engine = { path = "../rusty-engine/rust/crates/rusty-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync"] }
winit = "0.30"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[lints.rust]
unsafe_code = "forbid"
