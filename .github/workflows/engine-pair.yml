name: engine-pair

# Keeps the product on the newest published Engine pair. The pin advances
# only after the product builds, passes its managed checks and serves on the
# proposed pair (scripts/check-product.sh --managed on the pin committed
# locally); a pair that breaks the product opens (or updates) an issue
# instead, and main keeps its pin.

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact pair version to propose (default: newest published)"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: engine-pair
  cancel-in-progress: false

env:
  FAILURE_LABEL: engine-pair-update
  RUSTY_INSTALLER: https://raw.githubusercontent.com/FuzzySlipper/rusty-engine/32e7f99efd3a4ee6d20e094975c1547b88d6539a/scripts/install-rusty.sh

jobs:
  propose:
    # den-k8's self-hosted runner, as verify's product job.
    runs-on: [self-hosted, den-llvmpipe]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@10.15.0

      - name: Install the software Vulkan driver the runtime renderer draws with
        # mesa-vulkan-drivers supplies llvmpipe (lavapipe); the runner has no GPU.
        run: sudo apt-get update && sudo apt-get install --yes mesa-vulkan-drivers libvulkan1

      - name: Get rusty
        run: |
          curl -fsSL "$RUSTY_INSTALLER" | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Propose the pair
        id: propose
        env:
          VERSION: ${{ inputs.version }}
        run: |
          from=$(sed -n 's|.*<RustyEnginePackageVersion>\([^<]*\)</RustyEnginePackageVersion>.*|\1|p' Directory.Build.props)
          rusty update ${VERSION:+--to "$VERSION"} | tee update.log
          to=$(sed -n 's|.*<RustyEnginePackageVersion>\([^<]*\)</RustyEnginePackageVersion>.*|\1|p' Directory.Build.props)
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "to=$to" >> "$GITHUB_OUTPUT"
          if [[ "$from" == "$to" ]]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Commit the proposed pin here
        if: steps.propose.outputs.changed == 'true'
        env:
          TO: ${{ steps.propose.outputs.to }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "Adopt Engine pair $TO"
            echo
            echo "Built, checked and served by the engine-pair workflow ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            sed -n '/^What changed/,/^Next:/p' update.log | sed '$d'
          } > message.txt
          git commit -q -F message.txt Directory.Build.props

      - name: Check the product on the proposed pair
        # Every lane: a pin commit starts no verify run, so this is all it gets until the next push.
        if: steps.propose.outputs.changed == 'true'
        env:
          CHECK_PRODUCT_DIR: ${{ runner.temp }}/check-product
        run: |
          set -o pipefail
          scripts/check-product.sh --managed 2>&1 | tee check.log

      - name: Advance the pin
        if: steps.propose.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TO: ${{ steps.propose.outputs.to }}
        run: |
          # main moves during a run, so a rejected push is not a broken pair: rebase and try again.
          # A conflict means someone else moved the pin; the next run proposes from there.
          pushed=false
          for attempt in 1 2 3 4 5; do
            if ! git pull -q --rebase --autostash origin "$GITHUB_REF_NAME"; then
              git rebase --abort
              echo "$GITHUB_REF_NAME moved the pin during this run, so $TO was not adopted."
              exit 0
            fi
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              pushed=true
              break
            fi
            sleep $((attempt * 10))
          done
          [[ "$pushed" == true ]]
          for issue in $(gh issue list --label "$FAILURE_LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$issue" --comment "CraftSurvive adopted Engine pair $TO in $(git rev-parse --short HEAD)."
          done

      - name: Report the failed update
        if: failure() && steps.propose.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ steps.propose.outputs.from }}
          TO: ${{ steps.propose.outputs.to }}
        run: |
          {
            echo "The engine-pair workflow could not move CraftSurvive from \`$FROM\` to \`$TO\` on \`$GITHUB_REF_NAME\`. The pin was not changed."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "### Release notes to read"
            echo '```'
            sed -n '/^What changed/,/^Next:/p' update.log | sed '$d'
            echo '```'
            for log in check.log; do
              [[ -s "$log" ]] || continue
              echo "### Last lines of $log"
              echo '```'
              grep -E " error |error:|Error|FAILED" "$log" | head -n 20 || true
              tail -n 20 "$log"
              echo '```'
            done
          } > report.md
          gh label create "$FAILURE_LABEL" --color d73a4a --description "The newest Engine pair breaks CraftSurvive" 2>/dev/null || true
          existing=$(gh issue list --label "$FAILURE_LABEL" --state open --json number --jq '.[0].number')
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file report.md
          else
            gh issue create --label "$FAILURE_LABEL" --title "Engine pair $TO breaks CraftSurvive" --body-file report.md
          fi
