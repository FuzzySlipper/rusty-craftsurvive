name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pull requests share a group per ref, so a new push cancels the old run. Each
# commit on main has its own group: runs share no state and deploy nothing, so
# none waits for another, and no pending run is replaced before it starts.
concurrency:
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The bootstrap script is taken from a fixed Engine commit; it installs the
  # `rusty` of the exact pair pinned in Directory.Build.props.
  RUSTY_INSTALLER: https://raw.githubusercontent.com/FuzzySlipper/rusty-engine/32e7f99efd3a4ee6d20e094975c1547b88d6539a/scripts/install-rusty.sh

jobs:
  check:
    # The whole check is scripts/check-product.sh, the same command a machine on the den runs by hand:
    # the product build, the texture audit, the DOM companion, every managed lane, and the product
    # served and walked on llvmpipe. den-k8's self-hosted runner: Ubuntu 26.04 and Mesa's llvmpipe like
    # ubuntu-latest, with the den NAS mounted at /mnt/den-nas-backup. Its jobs queue while den-k8 is down.
    runs-on: [self-hosted, den-llvmpipe]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@10.15.0
      - name: Install rusty for the product's pinned Engine pair
        run: |
          pin=$(sed -n 's|.*<RustyEnginePackageVersion>\([^<]*\)</RustyEnginePackageVersion>.*|\1|p' Directory.Build.props)
          curl -fsSL "$RUSTY_INSTALLER" | bash -s -- --version "$pin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install the software Vulkan driver the runtime renderer draws with
        # mesa-vulkan-drivers supplies llvmpipe (lavapipe); the runner has no GPU.
        run: sudo apt-get update && sudo apt-get install --yes mesa-vulkan-drivers libvulkan1
      - name: Check the product (scripts/check-product.sh --managed)
        env:
          CHECK_PRODUCT_DIR: ${{ runner.temp }}/check-product
        run: scripts/check-product.sh --managed
      - name: Keep the failed check's logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-product-logs
          path: ${{ runner.temp }}/check-product/*/logs
          if-no-files-found: ignore
