name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-terrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install the product's paired Engine SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('src/CraftSurvive.Game/CraftSurvive.Game.csproj').findtext('.//RustyEngineSdkPackageVersion'))")
          archive="rusty-engine-csharp-pair-${version}-linux-x64.tar.gz"
          mkdir -p .runtime/download .runtime/ci-pair .runtime/sdk-feed
          gh release download "csharp-sdk-v${version}" --repo FuzzySlipper/rusty-engine --pattern "$archive" --pattern "$archive.sha256" --dir .runtime/download
          (cd .runtime/download && sha256sum -c "$archive.sha256")
          tar -xzf ".runtime/download/$archive" --strip-components=1 -C .runtime/ci-pair
          # These tests consume managed SDK values only; they do not launch the Linux runtime.
          cp .runtime/ci-pair/sdk-feed/*.nupkg .runtime/sdk-feed/
      - name: Check procedural planning and cave/dungeon layouts
        run: dotnet run --project tests/Procgen -c Release
      - name: Check offline generation artifacts
        run: dotnet run --project src/CraftSurvive.Procgen.Tool -c Release -- --self-check
      - name: Check terrain materials and residency cache
        run: dotnet run --project tests/TerrainResidency -c Release

  verify-product-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CraftSurvive
        uses: actions/checkout@v4

      - name: Install Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@10.15.0

      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check the DOM companion
        run: pnpm run check:ui
