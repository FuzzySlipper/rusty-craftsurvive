name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-csharp-lane:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CraftSurvive
        uses: actions/checkout@v4

      - name: Provision adjacent rolling-current Rusty Engine
        run: git clone --depth 1 https://github.com/FuzzySlipper/rusty-engine.git ../rusty-engine

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@10.15.0

      - name: Install native compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang \
            libwebkit2gtk-4.1-dev \
            libxkbcommon-x11-0

      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check the DOM companion
        run: pnpm run check:ui

      - name: Generate the Engine browser bundle
        run: node scripts/generate-browser-bundle.mjs src/ui/generated/product-bundle

      - name: Publish the NativeAOT product
        run: dotnet publish src/CraftSurvive.NativeProduct/CraftSurvive.NativeProduct.csproj --configuration Release --runtime linux-x64 --self-contained true
